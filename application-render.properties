# Render.com Production Profile
spring.profiles.active=render

# PostgreSQL (Render Managed)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis (Render Managed)
spring.data.redis.host=${RENDER_REDIS_HOST}
spring.data.redis.port=${RENDER_REDIS_PORT}

# Disable Kafka for Render (free tier)
kafka.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Gemini AI
gemini.api.key=${GEMINI_API_KEY}

# Security (use environment variable for production)
jwt.secret=${JWT_SECRET:please-change-this-in-production}

# Monitoring (disable for free tier)
management.metrics.export.prometheus.enabled=false