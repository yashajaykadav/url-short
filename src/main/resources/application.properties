# Server
server.port=8080
spring.config.import=optional:file:./secrets/application-secrets.properties

# ==================== DATABASE (PostgreSQL) ====================
spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener
spring.datasource.username=yash
spring.datasource.password=password123
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==================== Redis ====================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==================== Kafka ====================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=url-shortener-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.admin.auto-create=false

# ==================== Gemini AI ====================

gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-2.5-flash

# ==================== Actuator ====================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.slo.http.server.requests=10ms,50ms,100ms,200ms
management.metrics.tags.application=url-shortener